name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Detect which modules changed so we only test affected modules.
  detect-modules:
    name: Detect affected modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: modules
        run: |
          # Find all directories containing go.mod (excluding nested worktrees)
          MODULES=$(find . -type f -name go.mod -not -path '*/.go/*' | sed 's|/go.mod||' | sort)
          # Convert to JSON array for matrix strategy
          JSON=$(echo "$MODULES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$JSON" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (${{ matrix.module }})
    needs: detect-modules
    if: needs.detect-modules.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.3
          working-directory: ${{ matrix.module }}

  test:
    name: Test (${{ matrix.module }}, Go ${{ matrix.go-version }})
    needs: detect-modules
    if: needs.detect-modules.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-modules.outputs.modules) }}
        go-version: ["1.23", "1.24"]
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        working-directory: ${{ matrix.module }}
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage check
        working-directory: ${{ matrix.module }}
        run: |
          go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//' | { read cov; if [ "$(echo "$cov < 95" | bc)" -eq 1 ]; then echo "Coverage $cov% is below 95%"; exit 1; fi; echo "Coverage: $cov%"; }
      - name: Tidy check
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          go mod tidy -diff
          test -z "$(git status --porcelain go.mod go.sum)" || { echo "go.mod or go.sum is dirty after tidy"; exit 1; }
